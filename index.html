  const [active, setActive] = useState(0);
  const [done, setDone] = useState({});
  const [journals, setJournals] = useState({});
  const [copied, setCopied] = useState(false);
  const [mobileNav, setMobileNav] = useState(false);
  const [saveStatus, setSaveStatus] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [expandedParts, setExpandedParts] = useState({});

  const C = theme === "dark" ? DARK : LIGHT;

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s.theme) setTheme(s.theme);
        if (s.done) setDone(s.done);
        if (s.journals) setJournals(s.journals);
        if (s.expandedParts) setExpandedParts(s.expandedParts);
      }
    } catch (err) {}
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ theme, done, journals, expandedParts }));
    } catch (err) {}
  }, [theme, done, journals, expandedParts, loaded]);

  const toggleTheme = () => setTheme(theme === "dark" ? "light" : "dark");
  const toggleDone = (i) => setDone({ ...done, [i]: !done[i] });
  const togglePart = (id) => setExpandedParts({ ...expandedParts, [id]: !expandedParts[id] });

  const updateJournal = (fieldId, text) => {
    const existing = journals[fieldId] || {};
    setJournals({ ...journals, [fieldId]: { text, savedAt: existing.savedAt } });
  };

  const saveLessonJournals = () => {
    const stamp = new Date().toISOString();
    const next = { ...journals };
    const lesson = MODULE_DATA.lessons[active];
    const ids = [];
    if (lesson.journals) lesson.journals.forEach(j => ids.push(j.id));
    if (lesson.inventoryParts) lesson.inventoryParts.forEach(p => p.questions.forEach(q => ids.push(q.id)));
    if (lesson.reclamationFields) lesson.reclamationFields.forEach(r => r.fields.forEach(f => ids.push(f.id)));
    if (lesson.letterFieldId) ids.push(lesson.letterFieldId);
    ids.forEach(id => {
      if (next[id] && next[id].text) next[id] = { ...next[id], savedAt: stamp };
    });
    setJournals(next);
    setSaveStatus("Saved ✦");
    setTimeout(() => setSaveStatus(""), 2000);
  };

  const copyText = (text) => {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;left:-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (err) {}
  };

  const getEntries = (lesson) => {
    const out = [];
    if (lesson.journals) lesson.journals.forEach(j => {
      const en = journals[j.id];
      if (en && en.text) out.push({ prompt: j.prompt, text: en.text });
    });
    if (lesson.inventoryParts) lesson.inventoryParts.forEach(p => {
      p.questions.forEach(q => {
        const en = journals[q.id];
        if (en && en.text) out.push({ prompt: p.part + " · " + p.title + " — " + q.q, text: en.text });
      });
    });
    if (lesson.reclamationFields) lesson.reclamationFields.forEach(r => {
      r.fields.forEach(f => {
        const en = journals[f.id];
        if (en && en.text) out.push({ prompt: r.title + " — " + f.label, text: en.text });
      });
    });
    if (lesson.letterFieldId) {
      const en = journals[lesson.letterFieldId];
      if (en && en.text) out.push({ prompt: lesson.title, text: en.text });
    }
    return out;
  };

  const download = (filename, content) => {
    const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const exportLesson = (lesson) => {
    const entries = getEntries(lesson);
    const body = entries.length === 0 ? "No entries yet." : entries.map(en => en.prompt + "\n\n" + en.text + "\n\n────────────").join("\n\n");
    const content = "BADASS ALCHEMY · QUANTUM QUEEN\n" + MODULE_DATA.title + " — " + MODULE_DATA.subtitle + "\n" + lesson.title + "\nExported: " + new Date().toLocaleString() + "\n\n═════════════\n\n" + body;
    download("quantum-queen-" + lesson.title.toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".txt", content);
  };

  const exportAll = () => {
    const sections = MODULE_DATA.lessons.map(l => {
      const ents = getEntries(l);
      if (ents.length === 0) return null;
      return l.title.toUpperCase() + "\n\n" + ents.map(en => en.prompt + "\n\n" + en.text).join("\n\n────────\n\n");
    }).filter(Boolean).join("\n\n═════════════\n\n");
    const content = "BADASS ALCHEMY · QUANTUM QUEEN\n" + MODULE_DATA.title + " — " + MODULE_DATA.subtitle + "\nFull Journal Export\nExported: " + new Date().toLocaleString() + "\n\n═════════════\n\n" + (sections || "No entries yet.");
    download("quantum-queen-module-2-full-journal.txt", content);
  };

  const doneCount = Object.values(done).filter(Boolean).length;
  const progress = Math.round((doneCount / MODULE_DATA.lessons.length) * 100);
  const lesson = MODULE_DATA.lessons[active];
  const sidebarOverlay = theme === "dark"
    ? "linear-gradient(180deg, rgba(31,19,32,0.78) 0%, rgba(42,26,45,0.85) 100%)"
    : "linear-gradient(180deg, rgba(251,245,248,0.88) 0%, rgba(245,232,239,0.92) 100%)";

  return (
    <div style={{ fontFamily: "'Montserrat',sans-serif", background: C.bg, color: C.txtSec, height: "100vh", display: "flex", flexDirection: "column", overflow: "hidden" }}>

      {/* TOP BAR */}
      <div style={{ background: BRAND_GRAD, padding: "0 24px", height: 64, display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0, borderBottom: "1px solid " + C.border }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <button onClick={() => setMobileNav(!mobileNav)} className="mobile-only" style={{ background: "none", border: "none", color: "#3A1E33", fontSize: 20, cursor: "pointer", padding: 4 }}>☰</button>
          <div style={{ width: 36, height: 36, borderRadius: 10, background: "rgba(255,255,255,0.3)", display: "flex", alignItems: "center", justifyContent: "center", border: "1px solid rgba(255,255,255,0.4)" }}>
            <span style={{ color: "#3A1E33", fontSize: 16, fontWeight: 700 }}>✦</span>
          </div>
          <div>
            <div style={{ fontFamily: "'Cormorant Garamond',serif", fontWeight: 700, fontSize: 18, color: "#FFFFFF", lineHeight: 1 }}>Quantum Queen</div>
            <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 1.5, color: "#3A1E33", textTransform: "uppercase", marginTop: 3 }}>Badass Alchemy · Baddie Society</div>
          </div>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 24 }}>
          <div style={{ display: "flex", gap: 24 }} className="desktop-only">
            <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: 1.5, color: "#FFFFFF", textTransform: "uppercase", borderBottom: "2px solid #3A1E33", paddingBottom: 22, paddingTop: 22 }}>Classroom</span>
            <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: 1.5, color: "rgba(58,30,51,0.7)", textTransform: "uppercase", paddingBottom: 22, paddingTop: 22 }}>Community</span>
          </div>
          <button onClick={toggleTheme} style={{ display: "flex", alignItems: "center", gap: 6, background: "rgba(255,255,255,0.3)", border: "1px solid rgba(255,255,255,0.4)", borderRadius: 50, padding: "7px 14px", cursor: "pointer", color: "#3A1E33", fontSize: 11, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase" }}>
            <span style={{ fontSize: 13 }}>{theme === "dark" ? "☾" : "☀"}</span>
            <span className="desktop-only">{theme === "dark" ? "Dark" : "Light"}</span>
          </button>
        </div>
      </div>

      <div style={{ flex: 1, display: "flex", overflow: "hidden", position: "relative" }}>
        {mobileNav && <div onClick={() => setMobileNav(false)} className="mobile-only" style={{ position: "absolute", inset: 0, background: "rgba(31,19,32,0.7)", zIndex: 99 }} />}

        <div className={mobileNav ? "sidebar open" : "sidebar"} style={{
          width: 300, minWidth: 300, display: "flex", flexDirection: "column", overflow: "hidden",
          backgroundImage: sidebarOverlay + ", url('" + SIDEBAR_IMG + "')",
          backgroundSize: "cover", backgroundPosition: "center",
          borderRight: "1px solid " + C.border
        }}>
          <div style={{ padding: "26px 22px 22px", borderBottom: "1px solid " + C.border, background: theme === "dark" ? "rgba(22,12,24,0.35)" : "rgba(255,255,255,0.2)" }}>
            <div style={{ fontSize: 8, fontWeight: 700, letterSpacing: 1.5, color: theme === "dark" ? C.accentLt : C.accent, textTransform: "uppercase", marginBottom: 6 }}>{MODULE_DATA.title}</div>
            <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 24, fontWeight: 700, color: C.txt, lineHeight: 1.15, marginBottom: 4 }}>{MODULE_DATA.subtitle}</div>
            <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 12, fontStyle: "italic", color: theme === "dark" ? C.detail : C.accent, marginBottom: 16, lineHeight: 1.4 }}>{MODULE_DATA.tagline}</div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ flex: 1, height: 5, background: theme === "dark" ? "rgba(250,239,244,0.1)" : "rgba(110,56,101,0.15)", borderRadius: 100, overflow: "hidden" }}>
                <div style={{ height: "100%", background: "linear-gradient(90deg," + C.accent + "," + C.accentLt + ")", width: progress + "%", borderRadius: 100, transition: "width .5s" }} />
              </div>
              <div style={{ fontSize: 9, fontWeight: 700, color: theme === "dark" ? C.accentLt : C.accent, minWidth: 30, textAlign: "right" }}>{progress}%</div>
            </div>
          </div>

          <div style={{ flex: 1, overflowY: "auto", padding: "14px 12px 24px" }}>
            {MODULE_DATA.lessons.map((l, i) => {
              const isActive = active === i;
              const isDone = !!done[i];
              return (
                <div key={i} onClick={() => { setActive(i); setMobileNav(false); }} style={{
                  display: "flex", alignItems: "center", gap: 11, padding: "12px 14px", borderRadius: 12, cursor: "pointer", marginBottom: 4,
                  background: isActive ? (theme === "dark" ? "rgba(110,56,101,0.45)" : "rgba(255,255,255,0.7)") : (theme === "dark" ? "rgba(22,12,24,0.3)" : "rgba(255,255,255,0.35)"),
                  border: "1px solid " + (isActive ? C.borderMid : "transparent")
                }}>
                  <div style={{ width: 22, height: 22, minWidth: 22, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, background: isDone ? "linear-gradient(135deg," + C.accent + "," + C.accentLt + ")" : "transparent", border: isDone ? "none" : "1.5px solid " + C.borderMid }}>
                    {isDone && <span style={{ color: "#FFFFFF", fontSize: 12, fontWeight: 700 }}>✓</span>}
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 12.5, color: isActive ? C.txt : C.txtSec, fontWeight: isActive ? 700 : 500, lineHeight: 1.3 }}>{l.title}</div>
                    <div style={{ fontSize: 8, color: theme === "dark" ? C.txtFaded : C.txtMuted, letterSpacing: 0.5, marginTop: 2, fontWeight: 600 }}>{l.dur}</div>
                  </div>
                </div>
              );
            })}
          </div>

          <div style={{ padding: "14px 16px", borderTop: "1px solid " + C.border, background: theme === "dark" ? "rgba(22,12,24,0.5)" : "rgba(255,255,255,0.4)" }}>
            <button onClick={exportAll} style={{ width: "100%", fontSize: 9, fontWeight: 700, letterSpacing: 1.2, color: C.txt, background: "transparent", padding: "11px 12px", borderRadius: 50, border: "1px solid " + C.borderMid, cursor: "pointer", textTransform: "uppercase" }}>
              ⬇ Download All Journals
            </button>
          </div>
        </div>

        <div style={{ flex: 1, overflowY: "auto", background: C.bg }}>
          <div style={{ maxWidth: 720, padding: "36px 40px 80px" }} className="main-inner lesson-content" key={active + "-" + theme}>

            <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 2, color: C.accent, textTransform: "uppercase", marginBottom: 10 }}>
              Lesson {lesson.id + 1} of {MODULE_DATA.lessons.length} · {lesson.dur}
            </div>

            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 16, marginBottom: 22 }} className="lesson-top">
              <h1 style={{ fontFamily: "'Cormorant Garamond',serif", fontWeight: 700, fontSize: "clamp(26px,3.5vw,34px)", color: C.txt, lineHeight: 1.15 }}>{lesson.title}</h1>
              <button onClick={() => toggleDone(active)} style={{ flexShrink: 0, marginTop: 6, fontSize: 9, fontWeight: 700, letterSpacing: 1.2, padding: "10px 18px", borderRadius: 50, border: done[active] ? "none" : "1px solid " + C.borderMid, cursor: "pointer", background: done[active] ? "linear-gradient(135deg," + C.accent + "," + C.accentLt + ")" : "transparent", color: done[active] ? C.moonPrl : C.txtMuted, textTransform: "uppercase" }}>
                {done[active] ? "✦ Complete" : "○ Mark Complete"}
              </button>
            </div>

            {lesson.type === "video" && (
              <div style={{ background: BRAND_GRAD, borderRadius: 14, border: "1px solid " + C.borderMid, padding: "24px 26px", marginBottom: 28, boxShadow: theme === "light" ? C.shadow : "none" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 18 }}>
                  <div style={{ width: 52, height: 52, minWidth: 52, borderRadius: "50%", background: "rgba(255,255,255,0.25)", display: "flex", alignItems: "center", justifyContent: "center", border: "1px solid rgba(255,255,255,0.4)" }}>
                    <span style={{ fontSize: 20, color: "#FFFFFF" }}>▶</span>
                  </div>
                  <div>
                    <div style={{ fontSize: 10, fontWeight: 800, letterSpacing: 2, color: "#3A1E33", textTransform: "uppercase", marginBottom: 6 }}>Video Lesson</div>
                    <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 20, fontWeight: 700, color: "#FFFFFF", lineHeight: 1.35 }}>Watch this lesson inside the <em style={{ color: "#2A1424", fontStyle: "italic", fontWeight: 700 }}>Skool classroom.</em></div>
                  </div>
                </div>
              </div>
            )}

            <div style={{ fontWeight: 500, fontSize: 14.5, lineHeight: 1.8, color: C.txtSec, marginBottom: lesson.desc2 ? 18 : 36 }}>
              {lesson.desc}
            </div>

            {lesson.desc2 && (
              <div style={{ fontWeight: 500, fontSize: 14.5, lineHeight: 1.8, color: C.txtSec, marginBottom: 36, fontStyle: "italic", paddingLeft: 18, borderLeft: "2px solid " + C.borderMid }}>
                {lesson.desc2}
              </div>
            )}

            <SectionHeader icon="🌙" label="Key Takeaways" color={C.accent} />
            <div style={{ marginBottom: 36 }}>
              {lesson.takeaways.map((t, i) => (
                <div key={i} style={{ background: C.bgCard, borderRadius: 12, border: "1px solid " + C.border, padding: "14px 18px", marginBottom: 8, display: "flex", alignItems: "flex-start", gap: 12, boxShadow: theme === "light" ? "0 2px 8px rgba(110,56,101,0.06)" : "none" }}>
                  <span style={{ color: C.accent, fontSize: 13, marginTop: 3, flexShrink: 0 }}>✦</span>
                  <span style={{ fontWeight: 500, fontSize: 13.5, color: C.txtSec, lineHeight: 1.7 }}>{t}</span>
                </div>
              ))}
            </div>

            <SectionHeader icon="⭐" label="Action Steps" color={C.accent} />
            <div style={{ marginBottom: 36 }}>
              {lesson.actions.map((a, i) => (
                <div key={i} style={{ background: C.bgCard, borderRadius: 12, border: "1px solid " + C.border, padding: "14px 18px", marginBottom: 8, display: "flex", alignItems: "center", gap: 14, boxShadow: theme === "light" ? "0 2px 8px rgba(110,56,101,0.06)" : "none" }}>
                  <div style={{ width: 28, height: 28, minWidth: 28, borderRadius: "50%", background: "linear-gradient(135deg," + C.accent + "," + C.darkMid + ")", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700, color: C.moonPrl, flexShrink: 0 }}>0{i + 1}</div>
                  <span style={{ fontWeight: 500, fontSize: 13.5, color: C.txtSec, lineHeight: 1.65 }}>{a}</span>
                </div>
              ))}
            </div>

            {lesson.inventoryParts && (
              <div style={{ marginBottom: 36 }}>
                <SectionHeader icon="🔮" label="The Shadow Inventory" color={C.accent} status={saveStatus} />
                {lesson.inventoryParts.map((p, pi) => {
                  const isOpen = !!expandedParts[p.id];
                  const answeredCount = p.questions.filter(q => journals[q.id] && journals[q.id].text).length;
                  return (
                    <div key={p.id} style={{ background: C.bgCard, borderRadius: 14, border: "1px solid " + C.border, marginBottom: 14, boxShadow: theme === "light" ? C.shadow : "none", overflow: "hidden" }}>
                      <div onClick={() => togglePart(p.id)} style={{ padding: "20px 24px", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 14, background: isOpen ? (theme === "dark" ? "rgba(110,56,101,0.18)" : "rgba(181,123,174,0.08)") : "transparent", transition: "background .2s" }}>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 2, color: C.accent, textTransform: "uppercase", marginBottom: 4 }}>{p.part}</div>
                          <div style={{ fontFamily: "'Cormorant Garamond',serif", fontStyle: "italic", fontWeight: 700, fontSize: 22, color: theme === "dark" ? C.detail : C.accent, lineHeight: 1.2, marginBottom: 4 }}>{p.title}</div>
                          <div style={{ fontWeight: 500, fontSize: 12.5, color: C.txtMuted, lineHeight: 1.5, fontStyle: "italic" }}>{p.intro}</div>
                        </div>
                        <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6, flexShrink: 0 }}>
                          <div style={{ fontSize: 9, fontWeight: 700, color: C.txtFaded, letterSpacing: 1, textTransform: "uppercase" }}>{answeredCount}/{p.questions.length}</div>
                          <div style={{ width: 28, height: 28, borderRadius: "50%", background: isOpen ? "linear-gradient(135deg," + C.accent + "," + C.accentLt + ")" : "transparent", border: isOpen ? "none" : "1px solid " + C.borderMid, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontWeight: 700, color: isOpen ? "#FFFFFF" : C.txtMuted, transition: "all .2s" }}>
                            {isOpen ? "−" : "+"}
                          </div>
                        </div>
                      </div>
                      {isOpen && (
                        <div className="expand-content" style={{ padding: "8px 24px 24px", borderTop: "1px solid " + C.border }}>
                          {p.questions.map((q, qi) => {
                            const entry = journals[q.id];
                            return (
                              <div key={q.id} style={{ padding: "20px 0", borderBottom: qi < p.questions.length - 1 ? "1px solid " + C.border : "none" }}>
                                <div style={{ display: "flex", gap: 12, alignItems: "flex-start", marginBottom: 10 }}>
                                  <div style={{ fontSize: 11, fontWeight: 800, color: C.accent, letterSpacing: 1, minWidth: 28, marginTop: 3 }}>{String(qi + 1 + (pi === 0 ? 0 : pi === 1 ? 7 : pi === 2 ? 15 : 23)).padStart(2, "0")}</div>
                                  <div style={{ flex: 1 }}>
                                    <div style={{ fontFamily: "'Cormorant Garamond',serif", fontStyle: "italic", fontWeight: 700, fontSize: 17, color: theme === "dark" ? C.detail : C.accent, marginBottom: 8, lineHeight: 1.4 }}>{q.q}</div>
                                    <div style={{ fontSize: 12, color: C.txtMuted, lineHeight: 1.6, fontStyle: "italic", marginBottom: 12 }}>
                                      <span style={{ fontWeight: 700, fontStyle: "normal", textTransform: "uppercase", letterSpacing: 1, fontSize: 9, color: C.accent }}>Go Deeper · </span>
                                      {q.deeper}
                                    </div>
                                    {entry && entry.savedAt && (
                                      <div style={{ fontSize: 8, fontWeight: 700, color: C.txtFaded, letterSpacing: 1, marginBottom: 8, textTransform: "uppercase" }}>Last saved {new Date(entry.savedAt).toLocaleString()}</div>
                                    )}
                                    <textarea
                                      value={(entry && entry.text) || ""}
                                      onChange={(ev) => updateJournal(q.id, ev.target.value)}
                                      placeholder="Write what's true for you, Queen..."
                                      rows={4}
                                      style={{ width: "100%", background: C.inputBg, border: "1px solid " + C.border, borderRadius: 10, padding: "12px 14px", fontSize: 13.5, color: C.txtSec, lineHeight: 1.7, resize: "vertical" }}
                                    />
                                  </div>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
                <SaveExportButtons onSave={saveLessonJournals} onExport={() => exportLesson(lesson)} C={C} saveLabel="✦ Save Inventory" />
                <div style={{ fontWeight: 500, fontSize: 11, color: C.txtFaded, lineHeight: 1.7, marginTop: 14, letterSpacing: 0.3 }}>
                  Your entries save to this browser. Download the .txt to upload to Google Drive, Notion, or anywhere you keep your reflections.
                </div>
              </div>
            )}

            {lesson.reclamationFields && (
              <div style={{ marginBottom: 36 }}>
                <SectionHeader icon="🔮" label="Design Your Reclamation" color={C.accent} status={saveStatus} />
                {lesson.reclamationFields.map((r, ri) => (
                  <div key={r.id} style={{ background: C.bgCard, borderRadius: 14, border: "1px solid " + C.border, padding: 24, marginBottom: 14, boxShadow: theme === "light" ? C.shadow : "none" }}>
                    <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 2, color: C.accent, textTransform: "uppercase", marginBottom: 4 }}>{r.title}</div>
                    <div style={{ fontFamily: "'Cormorant Garamond',serif", fontStyle: "italic", fontWeight: 700, fontSize: 19, color: theme === "dark" ? C.detail : C.accent, marginBottom: 18, lineHeight: 1.3 }}>{r.intro}</div>
                    {r.fields.map(f => (
                      <div key={f.id} style={{ marginBottom: 14 }}>
                        <div style={{ fontWeight: 700, fontSize: 12, color: C.txtSec, marginBottom: 6, letterSpacing: 0.3 }}>{f.label}</div>
                        <textarea
                          value={(journals[f.id] && journals[f.id].text) || ""}
                          onChange={(ev) => updateJournal(f.id, ev.target.value)}
                          placeholder={f.placeholder || ""}
                          rows={2}
                          style={{ width: "100%", background: C.inputBg, border: "1px solid " + C.border, borderRadius: 10, padding: "12px 14px", fontSize: 13.5, color: C.txtSec, lineHeight: 1.6, resize: "vertical" }}
                        />
                      </div>
                    ))}
                  </div>
                ))}
                <SaveExportButtons onSave={saveLessonJournals} onExport={() => exportLesson(lesson)} C={C} saveLabel="✦ Save Reclamations" />
              </div>
            )}

            {lesson.journals && (
              <div style={{ marginBottom: 36 }}>
                <SectionHeader icon="🔮" label="Journal" color={C.accent} status={saveStatus} />
                {lesson.journals.map(j => {
                  const entry = journals[j.id];
                  return (
                    <div key={j.id} style={{ background: C.bgCard, borderRadius: 14, border: "1px solid " + C.border, padding: 22, marginBottom: 14, boxShadow: theme === "light" ? C.shadow : "none" }}>
                      <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 17, fontStyle: "italic", fontWeight: 700, color: theme === "dark" ? C.detail : C.accent, marginBottom: 6, lineHeight: 1.4 }}>{j.prompt}</div>
                      {entry && entry.savedAt && (
                        <div style={{ fontSize: 8, fontWeight: 700, color: C.txtFaded, letterSpacing: 1, marginBottom: 12, textTransform: "uppercase" }}>Last saved {new Date(entry.savedAt).toLocaleString()}</div>
                      )}
                      <textarea
                        value={(entry && entry.text) || ""}
                        onChange={(ev) => updateJournal(j.id, ev.target.value)}
                        placeholder="Write what's true for you today, Queen..."
                        rows={6}
                        style={{ width: "100%", background: C.inputBg, border: "1px solid " + C.border, borderRadius: 10, padding: "14px 16px", fontSize: 13.5, color: C.txtSec, lineHeight: 1.75, resize: "vertical", marginTop: 8 }}
                      />
                    </div>
                  );
                })}
                <SaveExportButtons onSave={saveLessonJournals} onExport={() => exportLesson(lesson)} C={C} saveLabel="✦ Save Entries" />
                <div style={{ fontWeight: 500, fontSize: 11, color: C.txtFaded, lineHeight: 1.7, marginTop: 14, letterSpacing: 0.3 }}>
                  Your entries save to this browser. Download the .txt to upload to Google Drive, Notion, or anywhere you keep your reflections.
                </div>
              </div>
            )}

            {lesson.letterPrompts && (
              <div style={{ marginBottom: 36 }}>
                <SectionHeader icon="💌" label="Write Your Letter" color={C.accent} status={saveStatus} />
                <div style={{ background: C.bgCard, borderRadius: 14, border: "1px solid " + C.border, padding: 24, marginBottom: 14, boxShadow: theme === "light" ? C.shadow : "none" }}>
                  <div style={{ fontFamily: "'Cormorant Garamond',serif", fontStyle: "italic", fontWeight: 700, fontSize: 18, color: theme === "dark" ? C.detail : C.accent, marginBottom: 14, lineHeight: 1.3 }}>Let these prompts move you through the letter</div>
                  {lesson.letterPrompts.map((p, i) => (
                    <div key={i} style={{ display: "flex", gap: 12, alignItems: "flex-start", padding: "12px 0", borderBottom: i < lesson.letterPrompts.length - 1 ? "1px solid " + C.border : "none" }}>
                      <div style={{ fontSize: 9, fontWeight: 800, color: C.accent, letterSpacing: 1, minWidth: 22, marginTop: 2 }}>0{i + 1}</div>
                      <div style={{ fontWeight: 500, fontSize: 13, color: C.txtSec, lineHeight: 1.65 }}>{p}</div>
                    </div>
                  ))}
                </div>
                <div style={{ background: C.bgCard, borderRadius: 14, border: "1px solid " + C.border, padding: 22, marginBottom: 14, boxShadow: theme === "light" ? C.shadow : "none" }}>
                  <div style={{ fontFamily: "'Cormorant Garamond',serif", fontStyle: "italic", fontWeight: 700, fontSize: 17, color: theme === "dark" ? C.detail : C.accent, marginBottom: 6, lineHeight: 1.4 }}>Your Letter</div>
                  {journals[lesson.letterFieldId] && journals[lesson.letterFieldId].savedAt && (
                    <div style={{ fontSize: 8, fontWeight: 700, color: C.txtFaded, letterSpacing: 1, marginBottom: 12, textTransform: "uppercase" }}>Last saved {new Date(journals[lesson.letterFieldId].savedAt).toLocaleString()}</div>
                  )}
                  <textarea
                    value={(journals[lesson.letterFieldId] && journals[lesson.letterFieldId].text) || ""}
                    onChange={(ev) => updateJournal(lesson.letterFieldId, ev.target.value)}
                    placeholder="Dear..."
                    rows={18}
                    style={{ width: "100%", background: C.inputBg, border: "1px solid " + C.border, borderRadius: 10, padding: "16px 18px", fontSize: 14, color: C.txtSec, lineHeight: 1.8, resize: "vertical", marginTop: 8 }}
                  />
                </div>
                <SaveExportButtons onSave={saveLessonJournals} onExport={() => exportLesson(lesson)} C={C} saveLabel="✦ Save Letter" />
              </div>
            )}

            <div style={{ marginTop: 44, paddingTop: 28, borderTop: "1px solid " + C.border, display: "flex", gap: 12, justifyContent: "space-between", alignItems: "center" }} className="lesson-bottom">
              {active > 0 ? (
                <button onClick={() => setActive(active - 1)} style={{ fontSize: 10, fontWeight: 700, letterSpacing: 1, color: C.txtMuted, background: "transparent", padding: "12px 22px", borderRadius: 50, border: "1px solid " + C.borderMid, cursor: "pointer", textTransform: "uppercase" }}>← Previous</button>
              ) : <span />}
              {active < MODULE_DATA.lessons.length - 1 && (
                <button onClick={() => setActive(active + 1)} style={{ fontSize: 10, fontWeight: 700, letterSpacing: 1, color: C.moonPrl, background: "linear-gradient(135deg," + C.accent + "," + C.darkMid + ")", padding: "13px 24px", borderRadius: 50, border: "none", cursor: "pointer", textTransform: "uppercase" }}>Next Lesson →</button>
              )}
            </div>

            <div style={{ marginTop: 56, paddingTop: 28, borderTop: "1px solid " + C.border, textAlign: "center" }}>
              <div style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: 18, fontStyle: "italic", color: C.accent, marginBottom: 6 }}>You are the alchemy.</div>
              <div style={{ fontSize: 8, fontWeight: 700, color: C.txtFaded, letterSpacing: 2, textTransform: "uppercase" }}>Badass Alchemy · Baddie Society · Quantum Queen</div>
            </div>

          </div>
        </div>
      </div>
    </div>
  );
}

function SectionHeader({ icon, label, color, status }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
      <span style={{ fontSize: 16 }}>{icon}</span>
      <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: 2, color: color, textTransform: "uppercase" }}>{label}</span>
      {status && <span style={{ marginLeft: "auto", fontSize: 9, fontWeight: 700, letterSpacing: 1, color: color }}>{status}</span>}
    </div>
  );
}

function SaveExportButtons({ onSave, onExport, C, saveLabel }) {
  return (
    <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 4 }}>
      <button onClick={onSave} style={{ flex: 1, minWidth: 120, fontSize: 10, fontWeight: 700, letterSpacing: 1, color: C.moonPrl, background: "linear-gradient(135deg," + C.accent + "," + C.darkMid + ")", padding: "12px 20px", borderRadius: 50, border: "none", cursor: "pointer", textTransform: "uppercase" }}>{saveLabel}</button>
      <button onClick={onExport} style={{ flex: 1, minWidth: 120, fontSize: 10, fontWeight: 700, letterSpacing: 1, color: C.txt, background: "transparent", padding: "11px 20px", borderRadius: 50, border: "1px solid " + C.borderMid, cursor: "pointer", textTransform: "uppercase" }}>⬇ Download .txt</button>
    </div>
  );
}

// Mount
document.getElementById('loading').style.display = 'none';
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

</body>
</html>
